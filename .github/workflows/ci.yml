name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - demo
  push:
    branches:
      - main
      - develop
      - demo

permissions:
  contents: read

jobs:
  checks:
    name: Package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # verified upstream actions/checkout
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # verified upstream pnpm/action-setup
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified upstream actions/setup-node
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
